<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punchpad: Comedy Notebook</title>
<meta name="description" content="Record your set, find your bits and your laughs, and find mics near you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--fg:#0a0a0a;--mfg:#6b6b6b;--faint:#9e9e9e;--glove:#ef8128}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e0e;--fg:#f4f4f4;--mfg:#a3a3a3;--faint:#6e6e6e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 Geist,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100vh;max-width:560px;margin:0 auto;padding:16vh 20px 40px;display:flex;flex-direction:column;gap:18px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--glove)}
h1{font-size:40px;font-weight:700;letter-spacing:-1.2px;line-height:1.05;margin:0}
p{margin:0;color:var(--mfg)}
footer{margin-top:auto;color:var(--faint);font-size:14px}
footer a{color:var(--faint)}
</style>
</head>
<body>
<main>
  <div class="mark"></div>
  <h1>Punchpad</h1>
  <p>The comedy notebook. Record your set, see your bits and where the laughs landed, and find mics near you.</p>
  <p>Coming to iPhone.</p>
  <footer>Punchpad</footer>
</main>
</body>
</html>
